<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mike's AI Forge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Analytics - Configured via environment variable -->
    <script>
      // This will be replaced by Vite with the actual env variable
      const GA_ID = import.meta.env.VITE_GA_MEASUREMENT_ID;
      if (GA_ID) {
        // Script injection will be handled by analyticsService.ts
      }
    </script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#0085FF', // Vibrant Blue
              'dark-primary': '#0D0D0D',   // Near-black background
              'dark-secondary': '#1A1A1A', // Card background
              'light-primary': '#FFFFFF',   // White text
              'light-secondary': '#A3A3A3',// Gray text
              'border-dark': '#262626',    // Subtle border
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'command-palette-enter': 'command-palette-enter 0.15s ease-out forwards',
              'command-palette-leave': 'command-palette-leave 0.15s ease-in forwards',
              'page-transition': 'pageTransition 0.4s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pageTransition: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' },
              },
              'command-palette-enter': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'command-palette-leave': {
                '0%': { opacity: '1', transform: 'scale(1)' },
                '100%': { opacity: '0', transform: 'scale(0.95)' },
              }
            },
            boxShadow: {
              'glow-blue': '0 0 20px rgba(0, 133, 255, 0.3)',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.2",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0"
  }
}
</script>
<style>
  body {
    background-color: #0D0D0D;
    background-image: radial-gradient(circle at top, rgba(0, 133, 255, 0.15), transparent 40%);
    background-repeat: no-repeat;
  }
  .tilt-card {
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
  }
  .glare-effect::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(
      circle 300px at var(--mouse-x) var(--mouse-y),
      rgba(255, 255, 255, 0.08),
      transparent 80%
    );
    opacity: 0;
    transition: opacity 0.2s ease-out;
    pointer-events: none;
    z-index: 10;
  }
  .group:hover .glare-effect::before,
  .tilt-card:hover .glare-effect::before {
    opacity: 1;
  }
  .shimmer::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    background-image: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0,
      rgba(255, 255, 255, 0.05) 20%,
      rgba(255, 255, 255, 0.2) 60%,
      rgba(255, 255, 255, 0)
    );
    animation: shimmer 2s infinite;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-dark-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
